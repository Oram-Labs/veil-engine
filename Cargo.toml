[workspace]
resolver = "2"
members = ["crates/engine", "crates/vault"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Oram-Labs/veil-engine"
publish = true

# The dependency versions below are copied from the Veil app's workspace when
# this repository is exported, so both build against the same versions.
[workspace.dependencies]
veil-engine = { path = "crates/engine", version = "0.2.1" }
aes-gcm = "0.10"
aho-corasick = "1"
arc-swap = "1"
getrandom = "0.3"
hkdf = "0.12"
hmac = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
lru = "0.16"
phonenumber = "0.3"
proptest = "1"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
