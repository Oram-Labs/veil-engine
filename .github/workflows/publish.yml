name: Publish to crates.io

# Runs only when started by hand (Actions > Publish to crates.io > Run
# workflow), never on a push. It needs a crates.io API token in the
# repository secret CARGO_REGISTRY_TOKEN.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the version being published (the one in Cargo.toml)
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The version typed matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "veil-engine") | .version')
          if [ "$version" != "${{ inputs.confirm }}" ]; then
            echo "Cargo.toml says $version, but ${{ inputs.confirm }} was typed."
            exit 1
          fi
      - run: cargo test --all-targets --locked
      # veil-vault depends on veil-engine, so the engine goes first.
      - run: cargo publish --locked -p veil-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish --locked -p veil-vault
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
