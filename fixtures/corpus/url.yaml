# Detection corpus for URL. Generated values are checksum-valid where the type has a checksum.
kind: URL
positive:
  - text: "https://example.com"
    match: "https://example.com"
  - text: "Value: http://example.com/path?q=1"
    match: "http://example.com/path?q=1"
  - text: "please use https://sub.domain.co.uk/a/b#frag today."
    match: "https://sub.domain.co.uk/a/b#frag"
  - text: "(https://user@host.example:8443/x)"
    match: "https://user@host.example:8443/x"
  - text: "\"https://en.wikipedia.org/wiki/Rust_(programming_language)\""
    match: "https://en.wikipedia.org/wiki/Rust_(programming_language)"
  - text: "{\"v\": \"http://10.0.0.1:8080/admin\"}"
    match: "http://10.0.0.1:8080/admin"
  - text: "line one\nhttps://api.acme.io/v1/items?id=42&x=y\nline two"
    match: "https://api.acme.io/v1/items?id=42&x=y"
  - text: "- https://example.com/%20space"
    match: "https://example.com/%20space"
  - text: "x=https://xn--bcher-kva.example/ y"
    match: "https://xn--bcher-kva.example/"
  - text: "Sent to http://a.b, thanks"
    match: "http://a.b"
  - text: "https://docs.example.com/guide/intro.html!"
    match: "https://docs.example.com/guide/intro.html"
  - text: "see [https://example.com/a,b] above"
    match: "https://example.com/a,b"
  - text: "https://cdn.example.net/img.png"
    match: "https://cdn.example.net/img.png"
  - text: "Value: https://example.com:443"
    match: "https://example.com:443"
  - text: "please use http://intranet.acme.internal:3000/dashboard today."
    match: "http://intranet.acme.internal:3000/dashboard"
  - text: "(https://github.com/v1o/redaction-engine/pull/1)"
    match: "https://github.com/v1o/redaction-engine/pull/1"
  - text: "\"https://example.com/~user\""
    match: "https://example.com/~user"
  - text: "{\"v\": \"https://example.com/?redirect=https%3A%2F%2Fx\"}"
    match: "https://example.com/?redirect=https%3A%2F%2Fx"
  - text: "line one\nhttps://shop.example/cart?item=a+b\nline two"
    match: "https://shop.example/cart?item=a+b"
  - text: "- https://example.org/path/"
    match: "https://example.org/path/"
negative:
  - "API_URL = http://localhost:8080/api"
  - "open http://127.0.0.1:5173/ in a browser"
  - "ftp://example.com"
  - "example.com"
  - "www.example.com"
  - "https://"
  - "http:/broken.com"
  - "mailto:ana@example.com"
  - "file:///etc/hosts"
  - "htps://typo.com"
  - "the http protocol"
  - "https colon slash slash"
  - "ws://socket.example"
  - "data:text/plain,hi"
  - "[URL_1]"
  - "git@github.com:x/y.git"
  - "C:\\path\\file"
  - "/relative/path"
  - "javascript:void(0)"
  - "http//no-colon.com"
  - "about:blank"
  - "https:example.com"
