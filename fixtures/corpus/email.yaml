# Detection corpus for EMAIL. Generated values are checksum-valid where the type has a checksum.
kind: EMAIL
positive:
  - text: "ana@example.com"
    match: "ana@example.com"
  - text: "Value: maria.ionescu@acme-holdings.com"
    match: "maria.ionescu@acme-holdings.com"
  - text: "please use first+tag@sub.domain.io today."
    match: "first+tag@sub.domain.io"
  - text: "(X@Y.DE)"
    match: "X@Y.DE"
  - text: "\"o'connor@example.ie\""
    match: "connor@example.ie"
  - text: "{\"v\": \"user_name@mail.example.co.uk\"}"
    match: "user_name@mail.example.co.uk"
  - text: "line one\na.b-c@d-e.f.museum\nline two"
    match: "a.b-c@d-e.f.museum"
  - text: "- jane.doe@company.travel"
    match: "jane.doe@company.travel"
  - text: "x=123@numbers.org y"
    match: "123@numbers.org"
  - text: "Sent to dev-ops@ci.example.dev, thanks"
    match: "dev-ops@ci.example.dev"
  - text: "UPPER@CASE.COM!"
    match: "UPPER@CASE.COM"
  - text: "see [x@y.io] above"
    match: "x@y.io"
  - text: "first.last@xn--bcher-kva.example"
    match: "first.last@xn--bcher-kva.example"
  - text: "Value: john@localhost.localdomain"
    match: "john@localhost.localdomain"
  - text: "please use s@t.uv today."
    match: "s@t.uv"
  - text: "(info@b2b-shop.de)"
    match: "info@b2b-shop.de"
  - text: "\"contact%sales@relay.example.net\""
    match: "contact%sales@relay.example.net"
  - text: "{\"v\": \"very.long.name.with.dots@example-mail.com\"}"
    match: "very.long.name.with.dots@example-mail.com"
  - text: "line one\npat@ex.ample.ro\nline two"
    match: "pat@ex.ample.ro"
  - text: "- z@zz.zz"
    match: "z@zz.zz"
negative:
  - "user@localhost"
  - "@handle"
  - "a@b"
  - "name at example dot com"
  - "foo@.com"
  - "email@-example.com"
  - "[EMAIL_1]"
  - "x@y.c"
  - "user@123"
  - "mailto:"
  - "first.last@"
  - "@example.com only"
  - "git@github"
  - "npm i @scope/pkg"
  - "time 10@20"
  - "price 5@3.50"
  - "ssh user@10.0.0.1"
  - "a@@b.com"
  - "plain text"
  - "user@exa mple.com"
