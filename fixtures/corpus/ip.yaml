# Detection corpus for IP. Generated values are checksum-valid where the type has a checksum.
kind: IP
positive:
  - text: "8.8.8.8"
    match: "8.8.8.8"
  - text: "Value: 203.0.113.5"
    match: "203.0.113.5"
  - text: "please use 198.51.100.23 today."
    match: "198.51.100.23"
  - text: "(192.168.1.10)"
    match: "192.168.1.10"
  - text: "\"10.0.0.42\""
    match: "10.0.0.42"
  - text: "{\"v\": \"172.16.5.4\"}"
    match: "172.16.5.4"
  - text: "line one\n1.1.1.1\nline two"
    match: "1.1.1.1"
  - text: "- 100.64.0.1"
    match: "100.64.0.1"
  - text: "x=45.33.32.156 y"
    match: "45.33.32.156"
  - text: "Sent to 2001:db8::1, thanks"
    match: "2001:db8::1"
  - text: "2001:0db8:85a3:0000:0000:8a2e:0370:7334!"
    match: "2001:0db8:85a3:0000:0000:8a2e:0370:7334"
  - text: "see [fe80::1ff:fe23:4567:890a] above"
    match: "fe80::1ff:fe23:4567:890a"
  - text: "2606:4700:4700::1111"
    match: "2606:4700:4700::1111"
  - text: "Value: fd12:3456:789a:1::1"
    match: "fd12:3456:789a:1::1"
  - text: "please use 151.101.1.69 today."
    match: "151.101.1.69"
  - text: "(93.184.216.34)"
    match: "93.184.216.34"
  - text: "\"2a00:1450:4001:82a::200e\""
    match: "2a00:1450:4001:82a::200e"
  - text: "{\"v\": \"169.254.10.20\"}"
    match: "169.254.10.20"
  - text: "line one\n13.32.0.1\nline two"
    match: "13.32.0.1"
  - text: "- 52.95.110.1"
    match: "52.95.110.1"
  - text: "2001:db8::1"
    match: "2001:db8::1"
  - text: "Server 2606:4700:4700::1111 is up"
    match: "2606:4700:4700::1111"
  - text: "ADDR=2001:DB8::A"
    match: "2001:DB8::A"
  - text: "connect to [2001:db8:85a3::8a2e:370:7334]:443"
    match: "2001:db8:85a3::8a2e:370:7334"
  - text: "2001:db8:0:0:0:0:2:1 end"
    match: "2001:db8:0:0:0:0:2:1"
negative:
  - "127.0.0.1"
  - "0.0.0.0"
  - "::1"
  - "::"
  - "999.1.1.1"
  - "1.2.3"
  - "v1.2.3.4"
  - "version 1.2.3.4.5"
  - "10:42:18"
  - "aa:bb:cc:dd:ee:ff"
  - "256.256.256.256"
  - "Score 1.2"
  - "std::vec::Vec"
  - "a::b::c"
  - "2026-10-08"
  - "localhost"
  - "1.2.3.4a"
  - "ratio 3:2"
  - "12:00"
  - "[IP_1]"
  - "Outcome::Error"
  - "Outcome::Audited"
  - "rec.outcome = Outcome::RateLimited;"
  - "Theme::from_str(s)"
  - "use std::fmt::Display;"
  - "Face::Dead"
  - "e::f"
  - "match x { A::B => 1 }"
  - "Source::BuiltIn"
