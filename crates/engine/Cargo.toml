[package]
name = "veil-engine"
description = "Detection, placeholders and restoration. No I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["redaction", "privacy", "pii", "anonymization", "llm"]
categories = ["text-processing"]

[features]
default = ["phone"]
# The phone number detector. Its number metadata is the largest part of the
# engine; without it, rules that turn phone detection on fail to compile.
phone = ["dep:phonenumber"]
# JSON Schema for RulesFile and its parts (`schemars::JsonSchema`).
schema = ["dep:schemars"]

[dependencies]
aho-corasick.workspace = true
arc-swap.workspace = true
hmac.workspace = true
lru.workspace = true
phonenumber = { workspace = true, optional = true }
regex.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde.workspace = true
proptest.workspace = true
serde_yaml_ng.workspace = true
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "engine"
harness = false
